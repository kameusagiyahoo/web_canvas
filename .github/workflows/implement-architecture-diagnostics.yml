name: Implement architecture diagnostics

on:
  push:
    branches: [main]
    paths:
      - scripts/implement-architecture-diagnostics.py
      - .github/workflows/implement-architecture-diagnostics.yml

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: python scripts/implement-architecture-diagnostics.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Commit implementation
        run: |
          rm -f scripts/implement-architecture-diagnostics.py .github/workflows/implement-architecture-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Add architecture flow diagnostics"
          git push
