name: Add navigation route drag

on:
  push:
    paths:
      - "scripts/add-navigation-route-drag.py"
      - ".github/workflows/add-navigation-route-drag.yml"

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: python scripts/add-navigation-route-drag.py
      - name: Track route drag at window level
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("components/NavigationGraph.tsx")
          text = path.read_text()

          state_anchor = '  const [pendingRoute, setPendingRoute] = useState<{ sourceFrameId: string; targetFrameId: string } | null>(null);\n'
          effect = '''  useEffect(() => {
            if (!routeDrag) return;
            const sourceFrameId = routeDrag.sourceFrameId;
            const move = (event: PointerEvent) => {
              setRouteDrag((current) => current
                ? { ...current, x1: event.clientX, y1: event.clientY }
                : current);
            };
            const up = (event: PointerEvent) => {
              const target = Array.from(document.querySelectorAll<HTMLElement>("[data-graph-frame-id]"))
                .find((element) => {
                  const rect = element.getBoundingClientRect();
                  return event.clientX >= rect.left && event.clientX <= rect.right && event.clientY >= rect.top && event.clientY <= rect.bottom;
                })?.dataset.graphFrameId;
              if (target) setPendingRoute({ sourceFrameId, targetFrameId: target });
              setRouteDrag(null);
            };
            window.addEventListener("pointermove", move);
            window.addEventListener("pointerup", up, { once: true });
            return () => {
              window.removeEventListener("pointermove", move);
              window.removeEventListener("pointerup", up);
            };
          }, [routeDrag?.sourceFrameId]);
'''
          if state_anchor not in text:
              raise SystemExit("route drag state anchor not found")
          text = text.replace(state_anchor, state_anchor + effect, 1)

          text = text.replace('                      event.currentTarget.setPointerCapture(event.pointerId);\n', '', 1)

          pattern = re.compile(
              r'\s*onPointerMove=\{\(event\) => \{.*?\}\}\s*onPointerUp=\{\(event\) => \{.*?setRouteDrag\(null\);\s*\}\}',
              re.S,
          )
          text, count = pattern.subn('', text, count=1)
          if count != 1:
              raise SystemExit(f"local route pointer handlers patch count={count}")

          path.write_text(text)
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: git rm -f scripts/add-navigation-route-drag.py .github/workflows/add-navigation-route-drag.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx components/NavigationGraph.tsx e2e/core.e2e.ts lib/navigation-graph-edit.ts lib/navigation-graph-create.test.ts
          git commit -m "Add drag-created navigation routes"
          git push
