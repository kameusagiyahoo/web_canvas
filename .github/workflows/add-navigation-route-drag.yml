name: Add navigation route drag

on:
  push:
    paths:
      - "scripts/add-navigation-route-drag.py"
      - ".github/workflows/add-navigation-route-drag.yml"

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: python scripts/add-navigation-route-drag.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: git rm -f scripts/add-navigation-route-drag.py .github/workflows/add-navigation-route-drag.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx components/NavigationGraph.tsx e2e/core.e2e.ts lib/navigation-graph-edit.ts lib/navigation-graph-create.test.ts
          git commit -m "Add drag-created navigation routes"
          git push
