name: Implement architecture search

on:
  push:
    branches: [main]
    paths:
      - "scripts/implement-architecture-search.py"
      - ".github/workflows/implement-architecture-search.yml"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Apply implementation
        run: python scripts/implement-architecture-search.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Commit implementation and remove temporary automation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/ArchitectureFlow.tsx e2e/core.e2e.ts docs/ARCHITECTURE_FLOW.md docs/TODO.md
          git rm scripts/implement-architecture-search.py .github/workflows/implement-architecture-search.yml
          git commit -m "Add architecture graph search and filters"
          git push
