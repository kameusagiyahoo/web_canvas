name: Implement Architecture binding diagnostics

on:
  push:
    branches: [chatgpt/binding-integrity]
    paths:
      - "scripts/implement-architecture-binding-diagnostics.py"
      - ".github/workflows/implement-architecture-binding-diagnostics.yml"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
      - name: Apply implementation
        run: |
          sed -i 's/missing incoming\/outgoing flow/missing incoming flow, missing outgoing flow/g' scripts/implement-architecture-binding-diagnostics.py
          python scripts/implement-architecture-binding-diagnostics.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Commit implementation and remove temporary automation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/architecture-flow.ts lib/architecture-flow.test.ts components/ArchitectureFlow.tsx e2e/core.e2e.ts docs/TODO.md docs/ARCHITECTURE_FLOW.md docs/ROADMAP.md
          git rm -f scripts/implement-architecture-binding-diagnostics.py .github/workflows/implement-architecture-binding-diagnostics.yml
          git commit -m "Diagnose broken Architecture Canvas bindings"
          git push
