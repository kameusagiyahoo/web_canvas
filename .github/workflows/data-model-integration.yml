name: Data Model integration

on:
  push:
    branches:
      - feature/data-model-foundation

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/data-model-foundation
          fetch-depth: 0
      - name: Apply integration patch
        run: python scripts/integrate-data-model.py
      - name: Commit integrated editor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Integrate Data Model workspace"
          git push origin HEAD:feature/data-model-foundation
