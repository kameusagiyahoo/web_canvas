name: Apply Quick flow Canvas binding patch

on:
  push:
    branches:
      - work/quick-flow-canvas-binding

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip quick-flow-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/quick-flow-canvas-binding
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - name: Apply focused source-binding patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old[:140]!r}")
              file.write_text(text.replace(old, new, 1))

          path = "components/ArchitectureFlow.tsx"
          replace_once(path,
              '  label: string;\n  screenName?: string;',
              '  label: string;\n  screenId?: string;\n  screenName?: string;')
          replace_once(path,
              '  onCreateQuickFlow: (draft: { sourceFrameId: string; targetFrameId?: string; actionName: string; apiName: string; apiMethod: ArchitectureHttpMethod; apiPath: string }) => void;',
              '  onCreateQuickFlow: (draft: { sourceFrameId: string; sourceItemId?: string; targetFrameId?: string; actionName: string; apiName: string; apiMethod: ArchitectureHttpMethod; apiPath: string }) => void;')
          replace_once(path,
              '    quickFlowHint: lang === "ja" ? "Screen → Action → API → 次のScreenをまとめて作成します。次のScreenは任意です。画面遷移は変更しません。" : "Create Screen → Action → API → next Screen in one step. The final Screen is optional and navigation is unchanged.",',
              '    quickFlowHint: lang === "ja" ? "Screen → Action → API → 次のScreenをまとめて作成します。開始ScreenのCanvas部品も任意で関連付けられ、既存Actionから選び直した場合は新Actionへ移ります。画面遷移は変更しません。" : "Create Screen → Action → API → next Screen in one step. Optionally bind a Canvas part from the start Screen; choosing one already owned by another Action moves that binding to the new Action. Navigation is unchanged.",')
          replace_once(path,
              '    quickSource: lang === "ja" ? "開始Screen" : "Start Screen",',
              '    quickSource: lang === "ja" ? "開始Screen" : "Start Screen",\n    quickCanvasSource: lang === "ja" ? "Canvas部品（任意）" : "Canvas part (optional)",\n    quickNoCanvasSource: lang === "ja" ? "Canvas部品と未接続" : "No Canvas part binding",')
          replace_once(path,
              '  const [quickSourceFrameId, setQuickSourceFrameId] = useState(frames[0]?.id ?? "");',
              '  const [quickSourceFrameId, setQuickSourceFrameId] = useState(frames[0]?.id ?? "");\n  const [quickSourceItemId, setQuickSourceItemId] = useState("");')
          replace_once(path,
              '  useEffect(() => {\n    if (!frames.some((frame) => frame.id === quickSourceFrameId)) setQuickSourceFrameId(frames[0]?.id ?? "");',
              '  const quickSourceItems = useMemo(\n    () => canvasItems.filter((item) => item.screenId === quickSourceFrameId),\n    [canvasItems, quickSourceFrameId],\n  );\n\n  useEffect(() => {\n    if (!frames.some((frame) => frame.id === quickSourceFrameId)) setQuickSourceFrameId(frames[0]?.id ?? "");\n    if (quickSourceItemId && !quickSourceItems.some((item) => item.id === quickSourceItemId)) setQuickSourceItemId("");')
          replace_once(path,
              '  }, [frames, quickSourceFrameId, quickTargetFrameId]);',
              '  }, [frames, quickSourceFrameId, quickSourceItemId, quickSourceItems, quickTargetFrameId]);')
          replace_once(path,
              '      sourceFrameId: quickSourceFrameId,\n      targetFrameId: quickTargetFrameId || undefined,',
              '      sourceFrameId: quickSourceFrameId,\n      sourceItemId: quickSourceItemId || undefined,\n      targetFrameId: quickTargetFrameId || undefined,')
          replace_once(path,
              '    setQuickActionName("");\n    setQuickApiName("");',
              '    setQuickSourceItemId("");\n    setQuickActionName("");\n    setQuickApiName("");')
          replace_once(path,
              'onChange={(event) => setQuickSourceFrameId(event.target.value)}',
              'onChange={(event) => { setQuickSourceFrameId(event.target.value); setQuickSourceItemId(""); }}')
          quick_source_marker = '              <input data-testid="architecture-quick-action"'
          quick_source_select = '''              <select data-testid="architecture-quick-canvas-source" aria-label={copy.quickCanvasSource} value={quickSourceItemId} onChange={(event) => setQuickSourceItemId(event.target.value)} disabled={!quickSourceItems.length} style={{ height: 44, borderRadius: 14, border: `1px solid ${p.outlineVariant}`, background: p.surface, color: p.onSurface, padding: "0 10px", font: "inherit", opacity: quickSourceItems.length ? 1 : 0.65 }}>
                <option value="">{copy.quickNoCanvasSource}</option>
                {quickSourceItems.map((item) => <option key={item.id} value={item.id}>{item.label}</option>)}
              </select>
'''
          replace_once(path, quick_source_marker, quick_source_select + quick_source_marker)

          path = "app/page.tsx"
          replace_once(path,
              '  const createArchitectureQuickFlowChain = (draft: { sourceFrameId: string; targetFrameId?: string; actionName: string; apiName: string; apiMethod: ArchitectureHttpMethod; apiPath: string }) => {',
              '  const createArchitectureQuickFlowChain = (draft: { sourceFrameId: string; sourceItemId?: string; targetFrameId?: string; actionName: string; apiName: string; apiMethod: ArchitectureHttpMethod; apiPath: string }) => {')
          replace_once(path,
              '      action: { id: actionId, name: draft.actionName },',
              '      action: { id: actionId, name: draft.actionName, sourceItemId: draft.sourceItemId },')
          replace_once(path,
              '        label: item.label.trim() || KIND_SPEC[item.kind].label,\n        screenName: owningFrame?.name || undefined,',
              '        label: item.label.trim() || KIND_SPEC[item.kind].label,\n        screenId: owningFrame?.id,\n        screenName: owningFrame?.name || undefined,')

          path = "lib/architecture-flow.ts"
          replace_once(path,
              '  action: Pick<ArchitectureActionNode, "id" | "name">;',
              '  action: Pick<ArchitectureActionNode, "id" | "name" | "sourceItemId">;')
          replace_once(path,
              '  const actionName = input.action.name.trim();\n  const apiId = input.api.id.trim();',
              '  const actionName = input.action.name.trim();\n  const sourceItemId = input.action.sourceItemId?.trim() || undefined;\n  const apiId = input.api.id.trim();')
          replace_once(path,
              '  let next = addArchitectureAction(flow, { id: actionId, kind: "action", name: actionName });\n  next = addArchitectureApi(next, { id: apiId, kind: "api", name: apiName, method: input.api.method, path: apiPath });',
              '  let next = addArchitectureAction(flow, { id: actionId, kind: "action", name: actionName });\n  if (sourceItemId) next = bindArchitectureActionSource(next, actionId, sourceItemId);\n  next = addArchitectureApi(next, { id: apiId, kind: "api", name: apiName, method: input.api.method, path: apiPath });')

          path = "lib/architecture-flow.test.ts"
          marker = '  it("rejects invalid quick-flow drafts before making partial changes", () => {'
          unit_test = '''  it("binds a Canvas source atomically while creating a Quick flow", () => {
    const flow = addArchitectureAction(empty(), { id: "old", kind: "action", name: "Old", sourceItemId: "go-details" });
    const created = createArchitectureQuickFlow(flow, frames, {
      sourceFrameId: "home",
      action: { id: "load", name: "Load details", sourceItemId: " go-details " },
      api: { id: "details-api", name: "Details API", method: "GET", path: "/api/details" },
      edgeIds: { sourceToAction: "e1", actionToApi: "e2" },
    });

    expect(created.nodes.find((node) => node.id === "old")).not.toHaveProperty("sourceItemId");
    expect(created.nodes.find((node) => node.id === "load")).toMatchObject({ sourceItemId: "go-details" });
    expect(created.edges).toHaveLength(2);
  });

'''
          replace_once(path, marker, unit_test + marker)

          path = "e2e/core.e2e.ts"
          replace_once(path,
              '  await architecture.getByTestId("architecture-quick-source").selectOption("home");\n  await architecture.getByTestId("architecture-quick-action").fill("Load details");',
              '  await architecture.getByTestId("architecture-quick-source").selectOption("home");\n  const quickCanvasSource = architecture.getByTestId("architecture-quick-canvas-source");\n  await expect(quickCanvasSource.locator(\'option[value="go-details"]\')).toHaveCount(1);\n  await expect(quickCanvasSource.locator(\'option[value="details-label"]\')).toHaveCount(0);\n  await quickCanvasSource.selectOption("go-details");\n  await architecture.getByTestId("architecture-quick-action").fill("Load details");')
          replace_once(path,
              '  await expect(architecture.locator(\'[data-testid^="architecture-graph-link-"]\')).toHaveCount(3);',
              '  await expect(architecture.locator(\'[data-testid^="architecture-graph-link-"]\')).toHaveCount(3);\n  await expect.poll(() => page.evaluate(() => {\n    const raw = localStorage.getItem("m3e:doc");\n    const flow = raw ? JSON.parse(raw).architecture : null;\n    const action = flow?.nodes?.find((node: { kind?: string; name?: string }) => node.kind === "action" && node.name === "Load details");\n    return action?.sourceItemId ?? "";\n  })).toBe("go-details");\n  await expect.poll(() => page.evaluate(() => {\n    const raw = localStorage.getItem("m3e:doc");\n    const doc = raw ? JSON.parse(raw) : null;\n    return doc?.groups?.[0]?.items?.[0]?.action?.to ?? "";\n  })).toBe("details");')
          replace_once(path,
              '  })).toEqual({ nodes: 0, edges: 0 });\n});\n\n\ntest("architecture visual graph creates semantic links and participates in undo",',
              '  })).toEqual({ nodes: 0, edges: 0 });\n  await expect.poll(() => page.evaluate(() => {\n    const raw = localStorage.getItem("m3e:doc");\n    const doc = raw ? JSON.parse(raw) : null;\n    return doc?.groups?.[0]?.items?.[0]?.action?.to ?? "";\n  })).toBe("details");\n});\n\n\ntest("architecture visual graph creates semantic links and participates in undo",')

          path = "docs/TODO.md"
          replace_once(path,
              '- [x] Add a one-step Architecture Quick flow creator for `Screen → Action → API → optional Screen`, committed as one Undo operation without changing navigation.',
              '- [x] Add a one-step Architecture Quick flow creator for `Screen → Action → API → optional Screen`, committed as one Undo operation without changing navigation.\n- [x] Let Architecture Quick flow optionally bind a Canvas part from the start Screen to the new Action in the same Undo operation, without changing navigation.')

          path = "docs/ARCHITECTURE_FLOW.md"
          replace_once(path,
              'A **Quick flow** form can create `Screen → Action → API → optional Screen` in one shared command and one Undo step; the final Screen remains semantic architecture metadata and never changes Preview/navigation.',
              'A **Quick flow** form can create `Screen → Action → API → optional Screen` in one shared command and one Undo step. It can optionally bind one existing Canvas part owned by the start Screen to the new Action; that binding uses the same exclusive ownership rule as the Inspectors, so an existing Action owner is released inside the same command. The final Screen remains semantic architecture metadata, and Quick flow never changes Preview/navigation.')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run test:e2e
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx components/ArchitectureFlow.tsx lib/architecture-flow.ts lib/architecture-flow.test.ts e2e/core.e2e.ts docs/TODO.md docs/ARCHITECTURE_FLOW.md
          git diff --cached --check
          git commit -m "Integrate Canvas binding into Architecture Quick flow"
          git push origin HEAD:work/quick-flow-canvas-binding
