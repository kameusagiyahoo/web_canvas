name: Apply Quick flow Canvas binding patch

on:
  push:
    branches:
      - work/quick-flow-canvas-binding

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip quick-flow-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/quick-flow-canvas-binding
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - name: Apply focused source-binding patch
        run: python .github/scripts/temp_quick_flow_patch.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run test:e2e
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx components/ArchitectureFlow.tsx lib/architecture-flow.ts lib/architecture-flow.test.ts e2e/core.e2e.ts docs/TODO.md docs/ARCHITECTURE_FLOW.md
          git diff --cached --check
          git commit -m "Integrate Canvas binding into Architecture Quick flow"
          git push origin HEAD:work/quick-flow-canvas-binding
