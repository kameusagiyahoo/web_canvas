name: Wire frame creation

on:
  push:
    paths:
      - scripts/wire-frame-creation.py

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: python scripts/wire-frame-creation.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: git rm scripts/wire-frame-creation.py .github/workflows/wire-frame-creation.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx lib/frame-commands.ts lib/frame-commands.test.ts lib/canvas-viewport.ts lib/canvas-viewport.test.ts
          git commit -m "Refactor frame creation and centering"
          git push
