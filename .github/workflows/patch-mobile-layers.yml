name: Patch mobile layers

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Add mobile layers controls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('app/page.tsx')
          text = page.read_text()

          text = text.replace(
              'const [sheet, setSheet] = useState<"edit" | "parts" | "screens" | "settings" | "lang" | null>(null);',
              'const [sheet, setSheet] = useState<"edit" | "parts" | "screens" | "layers" | "settings" | "lang" | null>(null);',
              1,
          )

          screens_button = '''          {isMobile && sheet === null && (\n            <button\n              onClick={() => setSheet("screens")}'''
          layers_button = '''          {isMobile && sheet === null && (\n            <button\n              onClick={() => setSheet("layers")}\n              title={t("layers", lang)}\n              aria-label={t("layers", lang)}\n              className="m3-press"\n              style={{\n                position: "absolute",\n                right: 160,\n                bottom: "calc(16px + var(--bottom-ui, 0px) + env(safe-area-inset-bottom))",\n                width: 64,\n                height: 64,\n                borderRadius: 20,\n                border: "none",\n                background: p.surfaceContainerHigh,\n                color: p.onSurfaceVariant,\n                cursor: "pointer",\n                display: "grid",\n                placeItems: "center",\n                zIndex: 46,\n                boxShadow: "0 6px 18px rgba(0,0,0,0.12)",\n              }}\n            >\n              <Icon name="layers" size={30} />\n            </button>\n          )}\n\n'''
          if screens_button not in text:
              raise SystemExit('mobile screens button anchor not found')
          text = text.replace(screens_button, layers_button + screens_button, 1)

          screens_sheet = '''            {isMobile && sheet === "screens" && (\n              <BottomSheet key="screens" p={p} onClose={() => setSheet(null)}>'''
          layers_sheet = '''            {isMobile && sheet === "layers" && (\n              <BottomSheet key="layers" p={p} onClose={() => setSheet(null)}>\n                <div style={{ height: "min(62vh, 560px)", minHeight: 320 }}>\n                  <LayersPanel\n                    p={p}\n                    frames={frames}\n                    frameId={layersFrame?.id ?? null}\n                    onFrame={(id) => {\n                      setLayersFrameId(id);\n                      setSelectedFrameId(id);\n                      setSelectedIds([]);\n                      focusFrame(id);\n                    }}\n                    groups={layerGroups}\n                    widths={widths}\n                    selectedIds={selectedIds}\n                    onSelect={(ids) => {\n                      setSelectedFrameId(null);\n                      setSelectedLinkId(null);\n                      setSelectedIds(ids);\n                    }}\n                    onReorder={reorderLayers}\n                    onReorderItems={reorderGroupItems}\n                    onDragging={onLayerDragging}\n                  />\n                </div>\n              </BottomSheet>\n            )}\n'''
          if screens_sheet not in text:
              raise SystemExit('mobile screens sheet anchor not found')
          text = text.replace(screens_sheet, layers_sheet + screens_sheet, 1)

          page.write_text(text)
          PY
      - name: Remove one-shot workflow
        run: git rm .github/workflows/patch-mobile-layers.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Add mobile layers and reordering controls"
          git push
