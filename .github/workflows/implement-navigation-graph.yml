name: Implement navigation graph

on:
  push:
    paths:
      - "scripts/implement-navigation-graph.py"
      - ".github/workflows/implement-navigation-graph.yml"

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: python scripts/implement-navigation-graph.py
      - name: Stabilize mobile graph close coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("e2e/core.e2e.ts")
          text = path.read_text()
          old = '  await page.keyboard.press("Escape");\n'
          new = '  await graph.getByRole("button", { name: "Close" }).click();\n'
          if old not in text:
              raise SystemExit("mobile graph close test anchor not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: git rm -f scripts/implement-navigation-graph.py .github/workflows/implement-navigation-graph.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx components/Toolbar.tsx components/MobileScreens.tsx components/NavigationGraph.tsx e2e/core.e2e.ts
          git commit -m "Add derived navigation graph overview"
          git push
