name: Patch mobile screen focus

on:
  push:
    paths:
      - '.github/workflows/patch-mobile-focus.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Focus active mobile screen and preserve edit target
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/page.tsx')
          text = path.read_text()

          # 1. Keep a stable mobile edit target even after a part becomes selected.
          old = 'const f = framesRef.current.find((x) => x.id === selectedFrameId) ?? framesRef.current[0];'
          new = 'const f = framesRef.current.find((x) => x.id === (selectedFrameId ?? layersFrameId)) ?? framesRef.current[0];'
          if old not in text:
              raise SystemExit('addPart frame target not found')
          text = text.replace(old, new, 1)

          # 2. Show the persistent mobile edit target in the Screens sheet.
          old = 'selectedId={selectedFrameId}'
          new = 'selectedId={selectedFrameId ?? layersFrameId ?? frames[0]?.id ?? null}'
          if old not in text:
              raise SystemExit('MobileScreens selectedId not found')
          text = text.replace(old, new, 1)

          # 3. Add a focused camera helper beside the existing fit ref.
          anchor = '''  const fitRef = useRef(fit);\n  fitRef.current = fit;'''
          insert = '''  const fitRef = useRef(fit);\n  fitRef.current = fit;\n\n  /** Mobile screen switching keeps one screen framed at a readable width. */\n  const focusFrame = useCallback((id: string) => {\n    const r = canvasRect();\n    const f = framesRef.current.find((x) => x.id === id);\n    if (!r || !f) return;\n    const { w } = frameSizeOf(f);\n    const pad = 14;\n    const top = 96;\n    const z = clamp((r.width - pad * 2) / (w + BEZEL * 2), MIN_Z, MAX_Z);\n    setView({\n      x: (r.width - w * z) / 2 - f.x * z,\n      y: top - (f.y - BEZEL - FRAME_LABEL_H) * z,\n      z,\n    });\n  }, []);'''
          if anchor not in text:
              raise SystemExit('fitRef anchor not found')
          text = text.replace(anchor, insert, 1)

          # 4. Selecting a screen from the mobile sheet focuses it immediately.
          old = '''                    setSelectedFrameId(id);\n                    setLayersFrameId(id);\n                    setSheet(null);'''
          new = '''                    setSelectedFrameId(id);\n                    setLayersFrameId(id);\n                    focusFrame(id);\n                    setSheet(null);'''
          if old not in text:
              raise SystemExit('mobile screen selection wiring not found')
          text = text.replace(old, new, 1)

          # 5. If the active screen is deleted, move the mobile edit target to another screen.
          old = 'onDelete={(id) => deleteFrame(id)}'
          new = '''onDelete={(id) => {\n                    const next = framesRef.current.find((f) => f.id !== id);\n                    deleteFrame(id);\n                    if (layersFrameId === id) {\n                      setLayersFrameId(next?.id ?? null);\n                      if (next) focusFrame(next.id);\n                    }\n                  }}'''
          if old not in text:
              raise SystemExit('mobile screen delete wiring not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Remove one-shot workflow
        run: git rm .github/workflows/patch-mobile-focus.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Keep mobile editing focused on the active screen"
          git push
