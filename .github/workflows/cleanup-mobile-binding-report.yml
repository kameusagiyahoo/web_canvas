name: Clean mobile binding branch

on:
  push:
    branches: [chatgpt/mobile-architecture-binding]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/mobile-architecture-binding
          fetch-depth: 0
      - name: Restore generated report and remove cleanup workflow
        run: |
          git fetch origin main
          git checkout origin/main -- playwright-report/index.html
          rm -f .github/workflows/cleanup-mobile-binding-report.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore generated Playwright report"
          git push origin HEAD:chatgpt/mobile-architecture-binding
