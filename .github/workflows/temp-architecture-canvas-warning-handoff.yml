name: Apply Architecture Canvas warning handoff patch

on:
  push:
    branches:
      - work/architecture-canvas-warning-handoff
    paths:
      - .github/scripts/temp_architecture_canvas_warning_handoff_patch.py
      - .github/workflows/temp-architecture-canvas-warning-handoff.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/architecture-canvas-warning-handoff
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Apply warning handoff patch
        run: python3 .github/scripts/temp_architecture_canvas_warning_handoff_patch.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run test:e2e
      - name: Commit product patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/ArchitectureFlow.tsx e2e/core.e2e.ts docs/ARCHITECTURE_FLOW.md docs/TODO.md
          git commit -m "Open Canvas trace warnings in Inspector [skip architecture-canvas-warning-handoff]"
          git push origin HEAD:work/architecture-canvas-warning-handoff
