name: Implement Architecture quick flow

on:
  push:
    branches: [chatgpt/architecture-quick-flow]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/architecture-quick-flow
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply implementation
        run: python scripts/implement_architecture_quick_flow.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - run: npx playwright install --with-deps chromium
      - name: Run focused Quick flow E2E first
        run: npx playwright test e2e/core.e2e.ts --grep "architecture Quick flow creates"
      - run: npm run test:e2e
      - name: Commit implementation and remove temporary automation
        run: |
          git checkout HEAD -- playwright-report/index.html || true
          rm -rf test-results
          rm -f scripts/implement_architecture_quick_flow.py
          rm -f .github/workflows/implement-architecture-quick-flow.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add Architecture Quick flow creation"
          git push origin HEAD:chatgpt/architecture-quick-flow
