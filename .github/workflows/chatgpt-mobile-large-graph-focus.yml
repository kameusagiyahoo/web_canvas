name: ChatGPT mobile large graph focus patch

on:
  push:
    branches:
      - chatgpt/mobile-large-graph-focus
    paths:
      - scripts/apply_mobile_large_graph_focus.py
      - .github/workflows/chatgpt-mobile-large-graph-focus.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/mobile-large-graph-focus
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/apply_mobile_large_graph_focus.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Improve large mobile graph search focus"
          git push origin HEAD:chatgpt/mobile-large-graph-focus
