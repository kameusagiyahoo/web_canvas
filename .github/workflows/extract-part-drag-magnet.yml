name: Extract part drag magnet

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-part-drag-magnet.yml"
      - "scripts/extract-part-drag-magnet.py"

permissions:
  contents: write

concurrency:
  group: extract-part-drag-magnet
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: python scripts/extract-part-drag-magnet.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: git rm scripts/extract-part-drag-magnet.py .github/workflows/extract-part-drag-magnet.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Refactor part drag snap and guide logic"
          git push
