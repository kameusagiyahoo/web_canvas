name: Implement mobile Architecture binding

on:
  push:
    branches: [chatgpt/mobile-architecture-binding]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/mobile-architecture-binding
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply implementation
        run: python scripts/implement_mobile_architecture_binding.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Commit implementation and remove temporary automation
        run: |
          rm -f scripts/implement_mobile_architecture_binding.py
          rm -f .github/workflows/implement-mobile-architecture-binding.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add mobile Architecture Canvas binding"
          git push origin HEAD:chatgpt/mobile-architecture-binding
