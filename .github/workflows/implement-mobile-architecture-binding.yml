name: Implement mobile Architecture binding

on:
  push:
    branches: [chatgpt/mobile-architecture-binding]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/mobile-architecture-binding
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply implementation
        run: python scripts/implement_mobile_architecture_binding.py
      - name: Select the mobile binding source through Screens and Layers in E2E
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('e2e/core.e2e.ts')
          text = path.read_text()
          old = '''  await page.locator('[data-screen="home"]').getByText("Go details", { exact: true }).click();
            await page.getByRole("button", { name: "Edit", exact: true }).click();'''.replace('    await', '  await')
          new = '''  const mobileScreenButton = page.getByTitle("Screen");
          await expect(mobileScreenButton).toBeVisible();
          await mobileScreenButton.click();
          await page.locator('button[aria-pressed]').filter({ hasText: "Home" }).click();
          await page.getByTitle("Layers").click();
          await page.getByRole("button").filter({ hasText: "Go details" }).first().click();
          await page.getByRole("button", { name: "Close (Esc)", exact: true }).click();
          await page.getByRole("button", { name: "Edit", exact: true }).click();'''
          if old not in text:
              raise SystemExit('mobile E2E selection block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - run: npx playwright install --with-deps chromium
      - name: Run focused mobile binding E2E first
        run: npx playwright test e2e/core.e2e.ts --grep "mobile Inspector binds Canvas parts"
      - run: npm run test:e2e
      - name: Commit implementation and remove temporary automation
        run: |
          rm -f scripts/implement_mobile_architecture_binding.py
          rm -f .github/workflows/implement-mobile-architecture-binding.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add mobile Architecture Canvas binding"
          git push origin HEAD:chatgpt/mobile-architecture-binding
