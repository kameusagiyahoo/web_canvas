name: Patch mobile interaction editor

on:
  push:
    paths:
      - '.github/workflows/patch-mobile-interactions.yml'
      - '.github/trigger-mobile-interactions'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch_mobile_interactions.py
      - name: Remove temporary patch files
        run: git rm .github/workflows/patch-mobile-interactions.yml .github/scripts/patch_mobile_interactions.py .github/trigger-mobile-interactions
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx components/Mobile.tsx
          git commit -m "Add mobile size and navigation editing"
          git push
