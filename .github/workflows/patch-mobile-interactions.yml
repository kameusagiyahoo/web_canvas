name: Patch mobile interaction editor

on:
  push:
    paths:
      - '.github/workflows/patch-mobile-interactions.yml'
      - '.github/trigger-mobile-interactions'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add mobile navigation and size controls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          mobile = Path('components/Mobile.tsx')
          text = mobile.read_text()

          old = 'import { CONTRASTS, Contrast, FONTS, Item, KIND_SPEC, NavTab, PALETTES, Palette, SHAPES, ShapeScale, Theme, defaultTabsFor, iconSlotsOf, setIconSlot } from "@/lib/tokens";'
          new = 'import { BACK_TARGET, CONTRASTS, Contrast, FONTS, Frame, Item, KIND_SPEC, NavTab, PALETTES, Palette, SHAPES, ShapeScale, Theme, TRANSITIONS, Transition, defaultTabsFor, iconSlotsOf, setIconSlot } from "@/lib/tokens";'
          if old not in text:
              raise SystemExit('mobile token import not found')
          text = text.replace(old, new, 1)

          old = '''  item,
  palette: p,
  onChange,'''
          new = '''  item,
  frames,
  palette: p,
  onChange,'''
          if old not in text:
              raise SystemExit('MobileInspector argument anchor not found')
          text = text.replace(old, new, 1)

          old = '''  item: Item;
  palette: Palette;
  onChange: (patch: Partial<Item>) => void;'''
          new = '''  item: Item;
  frames: Frame[];
  palette: Palette;
  onChange: (patch: Partial<Item>) => void;'''
          if old not in text:
              raise SystemExit('MobileInspector props anchor not found')
          text = text.replace(old, new, 1)

          anchor = '''      <Row icon="bolt" label={t("behavior", lang)} p={p}>
        <Field value={item.note ?? ""} onChange={(note) => onChange({ note })} placeholder={["button", "fab", "iconButton", "extendedFab"].includes(item.kind) ? t("whenPressed", lang) : t("whatItDoes", lang)} p={p} icon="bolt" height={48} />
      </Row>'''
          insert = '''      {spec.size && (
        <Row icon="straighten" label={t("size", lang)} p={p}>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
            {spec.size.presets.map((value) => {
              const on = item.size === value;
              return (
                <button key={value} type="button" className="m3-press" onClick={() => onChange({ size: value })} style={{ minWidth: 54, height: 40, padding: "0 12px", borderRadius: 20, border: "none", background: on ? p.primary : p.surfaceContainerHigh, color: on ? p.onPrimary : p.onSurfaceVariant, fontSize: 12, fontWeight: 700, cursor: "pointer" }}>{value}</button>
              );
            })}
          </div>
        </Row>
      )}

      <Row icon="link" label={t("action", lang)} p={p}>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
          <button type="button" className="m3-press" onClick={() => onChange({ action: undefined })} style={{ height: 40, padding: "0 12px", borderRadius: 20, border: "none", background: !item.action ? p.primary : p.surfaceContainerHigh, color: !item.action ? p.onPrimary : p.onSurfaceVariant, fontSize: 12, fontWeight: 700 }}>{t("none", lang)}</button>
          <button type="button" className="m3-press" onClick={() => onChange({ action: { to: BACK_TARGET, transition: "slide" } })} style={{ height: 40, padding: "0 12px", borderRadius: 20, border: "none", background: item.action?.to === BACK_TARGET ? p.primary : p.surfaceContainerHigh, color: item.action?.to === BACK_TARGET ? p.onPrimary : p.onSurfaceVariant, fontSize: 12, fontWeight: 700 }}>{t("goBack", lang)}</button>
          {frames.map((frame) => {
            const on = item.action?.to === frame.id;
            return <button key={frame.id} type="button" className="m3-press" onClick={() => onChange({ action: { to: frame.id, transition: item.action?.transition ?? "slide" } })} style={{ height: 40, maxWidth: 180, padding: "0 12px", borderRadius: 20, border: "none", background: on ? p.primary : p.surfaceContainerHigh, color: on ? p.onPrimary : p.onSurfaceVariant, fontSize: 12, fontWeight: 700, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{frame.name || t("screen", lang)}</button>;
          })}
        </div>
        {item.action && item.action.to !== BACK_TARGET && (
          <div style={{ marginTop: 8 }}>
            <Segmented<Transition> options={TRANSITIONS.map((tr) => ({ key: tr.key, icon: tr.icon, title: tr.label }))} value={item.action.transition} onChange={(transition) => onChange({ action: { ...item.action!, transition } })} p={p} height={40} />
          </div>
        )}
      </Row>

      <Row icon="bolt" label={t("behavior", lang)} p={p}>
        <Field value={item.note ?? ""} onChange={(note) => onChange({ note })} placeholder={["button", "fab", "iconButton", "extendedFab"].includes(item.kind) ? t("whenPressed", lang) : t("whatItDoes", lang)} p={p} icon="bolt" height={48} />
      </Row>'''
          if anchor not in text:
              raise SystemExit('behavior row anchor not found')
          text = text.replace(anchor, insert, 1)
          mobile.write_text(text)

          page = Path('app/page.tsx')
          text = page.read_text()
          old = '''                <MobileInspector
                  item={selected}
                  palette={p}'''
          new = '''                <MobileInspector
                  item={selected}
                  frames={frames}
                  palette={p}'''
          if old not in text:
              raise SystemExit('MobileInspector page wiring not found')
          text = text.replace(old, new, 1)
          page.write_text(text)
          PY

      - name: Remove one-shot workflow and trigger marker
        run: |
          git rm .github/workflows/patch-mobile-interactions.yml
          git rm -f .github/trigger-mobile-interactions

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Mobile.tsx app/page.tsx
          git commit -m "Add mobile size and navigation editing"
          git push