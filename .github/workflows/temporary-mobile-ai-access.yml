name: Temporary mobile AI access patch

on:
  push:
    branches:
      - chatgpt/mobile-ai-access

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/mobile-ai-access
          fetch-depth: 0
      - name: Apply exact source patch
        run: node scripts/patch-mobile-ai-access.mjs
      - name: Remove temporary automation
        run: rm scripts/patch-mobile-ai-access.mjs .github/workflows/temporary-mobile-ai-access.yml
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx components/Mobile.tsx scripts/patch-mobile-ai-access.mjs .github/workflows/temporary-mobile-ai-access.yml
          git diff --cached --quiet && exit 0
          git commit -m "Add mobile AI settings and behavior helper"
          git push origin HEAD:chatgpt/mobile-ai-access
