name: Improve project library

on:
  push:
    paths:
      - scripts/improve-project-library.py
      - .github/workflows/improve-project-library.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: python scripts/improve-project-library.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: git rm -f scripts/improve-project-library.py .github/workflows/improve-project-library.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx components/ProjectManager.tsx e2e/core.e2e.ts
          git commit -m "Improve local project switching and imports"
          git push
