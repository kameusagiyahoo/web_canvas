name: Apply mobile parity patch

on:
  push:
    branches:
      - work/mobile-parity-japanese-docs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/mobile-parity-japanese-docs
      - name: Apply focused mobile parity changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          page = Path("app/page.tsx")
          s = page.read_text()

          old = 'const [sheet, setSheet] = useState<"edit" | "parts" | "screens" | "layers" | "settings" | "lang" | null>(null);'
          new = 'const [sheet, setSheet] = useState<"edit" | "parts" | "screens" | "layers" | "settings" | "prompt" | "lang" | null>(null);'
          if old in s:
              s = s.replace(old, new, 1)

          old = '''            onPrompt={async () => {
              try {
                await navigator.clipboard.writeText(effectivePrompt(doc, widths, lang));
                showToast(t("copied", lang), 1400, "check");
              } catch {}
            }}'''
          new = '''            onPrompt={() => setSheet(sheet === "prompt" ? null : "prompt")}'''
          if old in s:
              s = s.replace(old, new, 1)

          anchor = '''            {isMobile && sheet === "lang" && (
              <BottomSheet key="lang" p={p} onClose={() => setSheet(null)}>
                <MobileLang'''
          block = '''            {isMobile && sheet === "prompt" && (
              <BottomSheet key="prompt" p={p} onClose={() => setSheet(null)}>
                <div style={{ height: "min(68vh, 640px)", minHeight: 420 }}>
                  <PromptPanel
                    doc={doc}
                    widths={widths}
                    palette={p}
                    onDoc={(patch) => {
                      if (patch.title !== undefined) setTitle(patch.title);
                      if (patch.brief !== undefined) setBrief(patch.brief);
                      if ("promptEdit" in patch) setPromptEdit(patch.promptEdit);
                      if ("platform" in patch) setPlatform(isPlatform(patch.platform) ? patch.platform : null);
                    }}
                  />
                </div>
              </BottomSheet>
            )}
'''
          if 'sheet === "prompt"' not in s and anchor in s:
              s = s.replace(anchor, block + anchor, 1)

          page.write_text(s)

          toolbar = Path("components/Toolbar.tsx")
          s = toolbar.read_text()
          old = '''            <GitHubLink p={p} size={S} />
            <button
              onClick={onPrompt}
              title={t("copyPrompt", lang)}'''
          new = '''            <IconBtn icon="play_arrow" p={p} onClick={onPreview} title={t("preview", lang)} size={S} fill />
            <button
              onClick={onPrompt}
              title={t("prompt", lang)}'''
          if old in s:
              s = s.replace(old, new, 1)
          toolbar.write_text(s)

          test = Path("e2e/prompt-targets.e2e.ts")
          s = test.read_text()
          addition = r'''

test("mobile Prompt opens the full target editor and persists PySide", async ({ page }) => {
  await initializeEnglishProfileOnce(page);
  await page.setViewportSize({ width: 390, height: 844 });
  await page.goto("/");
  await expect(page.getByTitle("Undo")).toBeVisible();

  await page.getByTitle("Prompt").click();
  const target = page.getByTestId("implementation-target");
  const prompt = page.getByRole("textbox", { name: "Prompt", exact: true });
  await expect(target).toBeVisible();
  await expect(target).toHaveValue("neutral");

  await target.selectOption("pyside");
  await expect(prompt).toHaveValue(/Python 3 and PySide6/);
  await expect(prompt).toHaveValue(/Qt Quick\/QML/);

  await expect.poll(async () =>
    page.evaluate(() => {
      const raw = localStorage.getItem("m3e:doc");
      return raw ? JSON.parse(raw).platform : null;
    }),
  ).toBe("pyside");

  await page.reload();
  await expect(page.getByTitle("Undo")).toBeVisible();
  await page.getByTitle("Prompt").click();
  await expect(page.getByTestId("implementation-target")).toHaveValue("pyside");
});
'''
          if 'mobile Prompt opens the full target editor' not in s:
              test.write_text(s.rstrip() + addition + "\n")
          PY
      - name: Check diff
        run: git diff --check
      - name: Commit patch if needed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx components/Toolbar.tsx e2e/prompt-targets.e2e.ts
          if git diff --cached --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git commit -m "Apply mobile prompt parity patch"
          git push origin HEAD:work/mobile-parity-japanese-docs
