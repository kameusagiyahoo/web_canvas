name: Mobile preview flow wiring

on:
  push:
    branches: [main]
    paths:
      - scripts/mobile-preview-flow.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: python scripts/mobile-preview-flow.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /web_canvas
      - run: git rm scripts/mobile-preview-flow.py .github/workflows/mobile-preview-flow.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx components/MobileScreens.tsx
          git commit -m "Improve mobile preview workflow"
          git push
