name: Implement project search

on:
  push:
    branches: [main]
    paths:
      - scripts/implement-project-search.py
      - .github/workflows/implement-project-search.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: python scripts/implement-project-search.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Commit implementation and remove temporary automation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/implement-project-search.py .github/workflows/implement-project-search.yml
          git add components/ProjectManager.tsx e2e/core.e2e.ts docs/TODO.md
          git commit -m "Add project manager search"
          git push
