name: Compare diff highlight integration

on:
  push:
    branches: [feature/compare-variants]
    paths:
      - .github/workflows/compare-highlight-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/compare-variants
      - name: Apply diff-to-screen highlight integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"target not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # Attach canonical part identities to every derived diff entry so the UI can
          # point back to the real parts without persisting any extra comparison model.
          replace_once(
              "lib/compare-diff.ts",
              '''export type CompareDiffEntry = {\n  category: CompareDiffCategory;\n  subject: string;\n  property: string;\n  before?: string;\n  after?: string;\n};''',
              '''export type CompareDiffEntry = {\n  category: CompareDiffCategory;\n  subject: string;\n  property: string;\n  before?: string;\n  after?: string;\n  /** canonical Item ids used only to focus/highlight the derived difference */\n  beforeItemId?: string;\n  afterItemId?: string;\n};''',
          )
          replace_once(
              "lib/compare-diff.ts",
              '''function comparePart(entries: CompareDiffEntry[], before: PartSnapshot, after: PartSnapshot, frames: Frame[]) {\n  const subject = partSubject(before.item);''',
              '''function comparePart(entries: CompareDiffEntry[], before: PartSnapshot, after: PartSnapshot, frames: Frame[]) {\n  const subject = partSubject(before.item);\n  const firstEntry = entries.length;''',
          )
          replace_once(
              "lib/compare-diff.ts",
              '''  compareProperty(entries, "navigation", subject, "slotTargets", beforeActions, afterActions);\n}''',
              '''  compareProperty(entries, "navigation", subject, "slotTargets", beforeActions, afterActions);\n\n  for (const entry of entries.slice(firstEntry)) {\n    entry.beforeItemId = before.item.id;\n    entry.afterItemId = after.item.id;\n  }\n}''',
          )
          replace_once(
              "lib/compare-diff.ts",
              '''    addEntry(entries, { category: "removed", subject: partSubject(removed.item), property: "part", before: "present", after: "removed" });''',
              '''    addEntry(entries, { category: "removed", subject: partSubject(removed.item), property: "part", before: "present", after: "removed", beforeItemId: removed.item.id });''',
          )
          replace_once(
              "lib/compare-diff.ts",
              '''    addEntry(entries, { category: "added", subject: partSubject(added.item), property: "part", before: "absent", after: "added" });''',
              '''    addEntry(entries, { category: "added", subject: partSubject(added.item), property: "part", before: "absent", after: "added", afterItemId: added.item.id });''',
          )

          # Unit coverage for the focus identity carried by derived entries.
          replace_once(
              "lib/compare-diff.test.ts",
              '''    expect(diff.entries.some((entry) => entry.property === "variant" && entry.before === "filled" && entry.after === "tonal")).toBe(true);\n    expect(diff.entries.some((entry) => entry.property === "tapTarget" && entry.after?.includes("target-b"))).toBe(true);''',
              '''    const variant = diff.entries.find((entry) => entry.property === "variant");\n    expect(variant).toMatchObject({\n      before: "filled",\n      after: "tonal",\n      beforeItemId: "ga-button",\n      afterItemId: "gb-button",\n    });\n    expect(diff.entries.some((entry) => entry.property === "tapTarget" && entry.after?.includes("target-b"))).toBe(true);''',
          )
          replace_once(
              "lib/compare-diff.test.ts",
              '''    expect(added.counts.added).toBe(1);\n    expect(added.counts.removed).toBe(0);\n    expect(removed.counts.removed).toBe(1);''',
              '''    expect(added.counts.added).toBe(1);\n    expect(added.counts.removed).toBe(0);\n    expect(added.entries.find((entry) => entry.category === "added")?.afterItemId).toBe("extra-text");\n    expect(removed.counts.removed).toBe(1);\n    expect(removed.entries.find((entry) => entry.category === "removed")?.beforeItemId).toBe("extra-text");''',
          )

          p = Path("components/CompareWorkspace.tsx")
          text = p.read_text()

          # Localised hint explaining the new interaction.
          for old, new in [
              ('      more: "件を省略",', '      more: "件を省略",\n      highlightHint: "差分を選択すると該当箇所を画面上で強調します。",'),
              ('      more: "项已省略",', '      more: "项已省略",\n      highlightHint: "选择差异后，会在画面上突出显示对应位置。",'),
              ('      more: "개 생략",', '      more: "개 생략",\n      highlightHint: "차이를 선택하면 해당 위치를 화면에서 강조합니다.",'),
              ('    more: "more",', '    more: "more",\n    highlightHint: "Select a difference to highlight the affected parts on the screens.",'),
          ]:
              if old not in text:
                  raise SystemExit(f"label target missing: {old}")
              text = text.replace(old, new, 1)

          # Miniature accepts a canonical Item id and draws a non-mutating overlay.
          old = '''  palette,\n  mobile,\n}: {\n  frame: Frame;\n  frames: Frame[];\n  groups: Group[];\n  widths: Record<string, number>;\n  palette: Palette;\n  mobile?: boolean;\n}) {'''
          new = '''  palette,\n  mobile,\n  highlightItemId,\n  highlightFrame,\n}: {\n  frame: Frame;\n  frames: Frame[];\n  groups: Group[];\n  widths: Record<string, number>;\n  palette: Palette;\n  mobile?: boolean;\n  highlightItemId?: string | null;\n  highlightFrame?: boolean;\n}) {'''
          if old not in text:
              raise SystemExit("FrameMiniature props target missing")
          text = text.replace(old, new, 1)

          old = '''  const owned = useMemo(\n    () => groups.filter((group) => frameOfGroup(group, frames, widths)?.id === frame.id),\n    [frame.id, frames, groups, widths],\n  );\n  const { w, h } = frameSizeOf(frame);'''
          new = '''  const owned = useMemo(\n    () => groups.filter((group) => frameOfGroup(group, frames, widths)?.id === frame.id),\n    [frame.id, frames, groups, widths],\n  );\n  const highlightedPart = highlightItemId\n    ? owned.flatMap((group) => layoutOf(group, widths)).find((placed) => placed.item.id === highlightItemId) ?? null\n    : null;\n  const { w, h } = frameSizeOf(frame);'''
          if old not in text:
              raise SystemExit("owned target missing")
          text = text.replace(old, new, 1)

          old = '''    <div\n      style={{\n        width: shownW,'''
          new = '''    <div\n      data-testid={highlightFrame ? `compare-highlight-frame-${frame.id}` : undefined}\n      style={{\n        width: shownW,'''
          if old not in text:
              raise SystemExit("mini outer target missing")
          text = text.replace(old, new, 1)

          old = '''        boxShadow: "0 8px 28px rgba(0,0,0,0.14)",'''
          new = '''        boxShadow: highlightFrame\n          ? `0 0 0 4px ${palette.primaryContainer}, 0 0 0 7px ${palette.primary}, 0 8px 28px rgba(0,0,0,0.14)`\n          : "0 8px 28px rgba(0,0,0,0.14)",'''
          if old not in text:
              raise SystemExit("mini shadow target missing")
          text = text.replace(old, new, 1)

          old = '''        })}\n      </div>\n    </div>\n  );\n}\n\nfunction DiffRow'''
          new = '''        })}\n        {highlightedPart && (\n          <div\n            data-testid={`compare-highlight-${frame.id}-${highlightedPart.item.id}`}\n            aria-hidden="true"\n            style={{\n              position: "absolute",\n              left: highlightedPart.x - frame.x,\n              top: highlightedPart.y - frame.y,\n              width: highlightedPart.w,\n              height: highlightedPart.h,\n              borderRadius: 12,\n              outline: `5px solid ${palette.primary}`,\n              outlineOffset: 3,\n              boxShadow: `0 0 0 8px ${palette.primaryContainer}`,\n              pointerEvents: "none",\n              zIndex: 20,\n            }}\n          />\n        )}\n      </div>\n    </div>\n  );\n}\n\nfunction DiffRow'''
          if old not in text:
              raise SystemExit("mini overlay insertion target missing")
          text = text.replace(old, new, 1)

          # Replace the row/panel block with an accessible selectable difference list.
          pattern = re.compile(r'function DiffRow\([\s\S]*?\n}\n\nexport function CompareWorkspace\(')
          replacement = r'''function DiffRow({
  entry,
  palette: p,
  lang,
  active,
  testId,
  onSelect,
}: {
  entry: CompareDiffEntry;
  palette: Palette;
  lang: Lang;
  active: boolean;
  testId: string;
  onSelect: () => void;
}) {
  return (
    <button
      type="button"
      data-testid={testId}
      aria-pressed={active}
      onClick={onSelect}
      className="m3-press"
      style={{
        width: "100%",
        display: "grid",
        gridTemplateColumns: "minmax(110px, 0.8fr) minmax(0, 1.4fr)",
        gap: 8,
        padding: "7px 8px",
        border: "none",
        borderTop: `1px solid ${p.outlineVariant}`,
        borderRadius: 8,
        background: active ? p.primaryContainer : "transparent",
        color: active ? p.onPrimaryContainer : p.onSurface,
        textAlign: "left",
        font: "inherit",
        fontSize: 11,
        lineHeight: 1.35,
        cursor: "pointer",
      }}
    >
      <span style={{ minWidth: 0, fontWeight: 720 }}>
        {entry.subject}
      </span>
      <span style={{ minWidth: 0, color: active ? p.onPrimaryContainer : p.onSurfaceVariant, overflowWrap: "anywhere" }}>
        <strong style={{ color: "inherit" }}>{propertyLabel(entry.property, lang)}</strong>
        {entry.before !== undefined && entry.after !== undefined ? ` · ${entry.before} → ${entry.after}` : ""}
      </span>
    </button>
  );
}

function DiffPanel({
  summary,
  palette: p,
  lang,
  mobile,
  frameId,
  activeKey,
  onSelectEntry,
}: {
  summary: CompareDiffSummary;
  palette: Palette;
  lang: Lang;
  mobile?: boolean;
  frameId: string;
  activeKey?: string | null;
  onSelectEntry: (entry: CompareDiffEntry, key: string) => void;
}) {
  const text = labels(lang);
  const shown = summary.entries.slice(0, mobile ? 5 : 8);
  const hidden = summary.entries.length - shown.length;
  const activeCategories = Object.entries(summary.counts).filter(([, count]) => count > 0) as Array<[
    keyof typeof text.categories,
    number,
  ]>;
  const entryKey = (entry: CompareDiffEntry, index: number) =>
    `${frameId}:${index}:${entry.category}:${entry.property}:${entry.beforeItemId ?? ""}:${entry.afterItemId ?? ""}`;

  return (
    <div
      data-testid={`compare-diff-${frameId}`}
      style={{
        margin: "0 12px 12px",
        padding: "10px 12px",
        borderRadius: 16,
        background: summary.total === 0 ? p.secondaryContainer : p.surfaceContainerHigh,
        color: summary.total === 0 ? p.onSecondaryContainer : p.onSurface,
      }}
    >
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <Icon name={summary.total === 0 ? "check_circle" : "difference"} size={18} />
        <span style={{ fontSize: 12, fontWeight: 780 }}>{text.diff}</span>
        <span
          data-testid={`compare-diff-count-${frameId}`}
          style={{ marginLeft: "auto", fontSize: 11, fontWeight: 760 }}
        >
          {summary.total === 0 ? text.same : `${summary.total} ${text.changes}`}
        </span>
      </div>

      {summary.total > 0 && (
        <>
          <div style={{ marginTop: 6, fontSize: 10, color: p.onSurfaceVariant }}>
            {text.highlightHint}
          </div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 8 }}>
            {activeCategories.map(([category, count]) => (
              <span
                key={category}
                style={{
                  minHeight: 24,
                  padding: "0 8px",
                  borderRadius: 12,
                  background: category === "added"
                    ? p.primaryContainer
                    : category === "removed"
                      ? p.errorContainer
                      : p.surfaceContainerHighest,
                  color: category === "added"
                    ? p.onPrimaryContainer
                    : category === "removed"
                      ? p.onErrorContainer
                      : p.onSurfaceVariant,
                  display: "inline-flex",
                  alignItems: "center",
                  fontSize: 10,
                  fontWeight: 720,
                }}
              >
                {text.categories[category]} {count}
              </span>
            ))}
          </div>
          <div style={{ marginTop: 5 }}>
            {shown.map((entry, index) => {
              const key = entryKey(entry, index);
              return (
                <DiffRow
                  key={key}
                  entry={entry}
                  palette={p}
                  lang={lang}
                  active={activeKey === key}
                  testId={`compare-diff-row-${frameId}-${index}`}
                  onSelect={() => onSelectEntry(entry, key)}
                />
              );
            })}
            {hidden > 0 && (
              <div style={{ paddingTop: 7, fontSize: 10, color: p.onSurfaceVariant }}>
                +{hidden} {text.more}
              </div>
            )}
          </div>
        </>
      )}
    </div>
  );
}

export function CompareWorkspace('''
          if not pattern.search(text):
              raise SystemExit("DiffRow/DiffPanel block not found")
          text = pattern.sub(replacement, text, count=1)

          old = '''  const lang = useLang();\n  const text = labels(lang);\n  const [slots, setSlots] = useState<CompareSlot[]>(() => initialSlots(frames, initialFrameId));'''
          new = '''  const lang = useLang();\n  const text = labels(lang);\n  const [slots, setSlots] = useState<CompareSlot[]>(() => initialSlots(frames, initialFrameId));\n  const [activeDiff, setActiveDiff] = useState<{ candidateFrameId: string; key: string; entry: CompareDiffEntry } | null>(null);'''
          if old not in text:
              raise SystemExit("workspace state target missing")
          text = text.replace(old, new, 1)

          old = '''  useEffect(() => {\n    const onKey = (event: KeyboardEvent) => {'''
          new = '''  useEffect(() => {\n    setActiveDiff(null);\n  }, [slots]);\n\n  useEffect(() => {\n    const onKey = (event: KeyboardEvent) => {'''
          if old not in text:
              raise SystemExit("workspace effect target missing")
          text = text.replace(old, new, 1)

          old = '''                const size = frameSizeOf(frame);\n                const diff = index === 0 ? null : diffByFrame.get(frame.id) ?? null;\n                return ('''
          new = '''                const size = frameSizeOf(frame);\n                const diff = index === 0 ? null : diffByFrame.get(frame.id) ?? null;\n                const candidateActive = activeDiff?.candidateFrameId === frame.id;\n                const highlightItemId = index === 0\n                  ? activeDiff?.entry.beforeItemId ?? null\n                  : candidateActive\n                    ? activeDiff?.entry.afterItemId ?? null\n                    : null;\n                const highlightFrame = !!activeDiff\n                  && !activeDiff.entry.beforeItemId\n                  && !activeDiff.entry.afterItemId\n                  && (index === 0 || candidateActive);\n                return ('''
          if old not in text:
              raise SystemExit("render highlight state target missing")
          text = text.replace(old, new, 1)

          old = '''                    {diff && <DiffPanel summary={diff} palette={p} lang={lang} mobile={mobile} frameId={frame.id} />}'''
          new = '''                    {diff && (\n                      <DiffPanel\n                        summary={diff}\n                        palette={p}\n                        lang={lang}\n                        mobile={mobile}\n                        frameId={frame.id}\n                        activeKey={candidateActive ? activeDiff?.key : null}\n                        onSelectEntry={(entry, key) => setActiveDiff((current) =>\n                          current?.key === key\n                            ? null\n                            : { candidateFrameId: frame.id, key, entry },\n                        )}\n                      />\n                    )}'''
          if old not in text:
              raise SystemExit("DiffPanel call target missing")
          text = text.replace(old, new, 1)

          old = '''                      <FrameMiniature frame={frame} frames={frames} groups={groups} widths={widths} palette={p} mobile={mobile} />'''
          new = '''                      <FrameMiniature\n                        frame={frame}\n                        frames={frames}\n                        groups={groups}\n                        widths={widths}\n                        palette={p}\n                        mobile={mobile}\n                        highlightItemId={highlightItemId}\n                        highlightFrame={highlightFrame}\n                      />'''
          if old not in text:
              raise SystemExit("FrameMiniature call target missing")
          text = text.replace(old, new, 1)

          p.write_text(text)

          # E2E proves that a derived row can focus both canonical parts without mutation.
          replace_once(
              "e2e/compare-variants.e2e.ts",
              '''  await expect(workspace.getByTestId("compare-diff-details")).toContainText("label");\n  await expect(workspace.getByTestId("compare-diff-details")).toContainText("variant");''',
              '''  await expect(workspace.getByTestId("compare-diff-details")).toContainText("label");\n  await expect(workspace.getByTestId("compare-diff-details")).toContainText("variant");\n  await workspace.getByTestId("compare-diff-row-details-0").click();\n  await expect(workspace.getByTestId("compare-highlight-home-home-button")).toBeVisible();\n  await expect(workspace.getByTestId("compare-highlight-details-details-button")).toBeVisible();''',
          )

          # Record that highlight is derived presentation state, not a new model.
          p = Path("docs/COMPARE_VARIANTS.md")
          doc = p.read_text()
          marker = '''The diff is explanatory design metadata only. It does not execute navigation, mutate either Screen, or become another source of truth.'''
          addition = marker + '''\n\n### Difference focus\n\nEach visible difference row is keyboard-focusable and selectable. Selecting a part-level difference highlights the matched canonical Item on A and on the compared Screen. Added/removed differences highlight only the side where the Item exists. Screen-level differences such as dimensions, background, or swipe targets highlight the Screen frame itself.\n\nThe highlight is transient view state. It stores no coordinates, no copied Item data, and no saved diff result; it follows the Item ids already carried by the derived comparison entry.'''
          if marker not in doc:
              raise SystemExit("compare doc marker missing")
          p.write_text(doc.replace(marker, addition, 1))
          PY

      - name: Commit integrated Compare highlighting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/compare-highlight-integration.yml
          git add components/CompareWorkspace.tsx lib/compare-diff.ts lib/compare-diff.test.ts e2e/compare-variants.e2e.ts docs/COMPARE_VARIANTS.md
          git commit -m "Highlight selected Compare differences on screens"
          git push origin HEAD:feature/compare-variants
