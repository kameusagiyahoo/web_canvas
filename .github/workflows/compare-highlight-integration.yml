name: Compare highlight integration

on:
  push:
    branches:
      - feature/compare-variants

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/compare-variants
          fetch-depth: 0
      - name: Apply highlight integration
        run: python scripts/integrate-compare-highlight.py
      - name: Commit highlighted Compare workspace
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Highlight selected Compare differences on screens"
          git push origin HEAD:feature/compare-variants
