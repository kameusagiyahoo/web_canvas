name: Fix mobile size type

on:
  push:
    paths:
      - '.github/run-fix-mobile-size'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/fix_mobile_size.py
      - run: git rm .github/workflows/fix-mobile-size.yml .github/scripts/fix_mobile_size.py .github/run-fix-mobile-size
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Mobile.tsx
          git commit -m "Fix mobile size preset typing"
          git push
