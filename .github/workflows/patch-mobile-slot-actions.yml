name: Patch mobile slot actions

on:
  push:
    paths:
      - '.github/trigger-mobile-slot-actions'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add per-slot mobile navigation editing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/Mobile.tsx')
          text = path.read_text()

          old = 'import { BACK_TARGET, CONTRASTS, Contrast, FONTS, Frame, Item, KIND_SPEC, NavTab, PALETTES, Palette, SHAPES, ShapeScale, Theme, TRANSITIONS, Transition, defaultTabsFor, iconSlotsOf, setIconSlot } from "@/lib/tokens";'
          new = 'import { Action, BACK_TARGET, CONTRASTS, Contrast, FONTS, Frame, Item, KIND_SPEC, NavTab, PALETTES, Palette, SHAPES, ShapeScale, Theme, TRANSITIONS, Transition, actionSlotsOf, defaultTabsFor, iconSlotsOf, setIconSlot } from "@/lib/tokens";'
          if old not in text:
              raise SystemExit('token import anchor not found')
          text = text.replace(old, new, 1)

          old = '  const [tabSlot, setTabSlot] = useState<number | null>(null);\n'
          new = '''  const [tabSlot, setTabSlot] = useState<number | null>(null);\n  const actionSlots = actionSlotsOf(item);\n  const [actionSlot, setActionSlot] = useState("");\n  const setSlotAction = (key: string, action: Action | undefined) => {\n    const actions = { ...(item.actions ?? {}) };\n    if (action) actions[key] = action;\n    else delete actions[key];\n    onChange({ actions: Object.keys(actions).length ? actions : undefined });\n  };\n'''
          if old not in text:
              raise SystemExit('tabSlot anchor not found')
          text = text.replace(old, new, 1)

          old = '''  useEffect(() => {\n    setSlotKey(iconSlotsOf(item)[0]?.key ?? "icon");\n    setPickerOpen(false);\n  }, [item.id]);'''
          new = '''  useEffect(() => {\n    setSlotKey(iconSlotsOf(item)[0]?.key ?? "icon");\n    setPickerOpen(false);\n    setActionSlot("");\n  }, [item.id]);'''
          if old not in text:
              raise SystemExit('item reset effect anchor not found')
          text = text.replace(old, new, 1)

          start_marker = '      <Row icon="link" label={t("action", lang)} p={p}>'
          end_marker = '      <Row icon="bolt" label={t("behavior", lang)} p={p}>'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('action row markers not found')

          replacement = '''      <Row icon="link" label={t("action", lang)} p={p}>\n        {actionSlots.length > 0 ? (\n          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>\n            <Segmented<string>\n              options={actionSlots.map((slot) => ({ key: slot.key, icon: slot.value ?? undefined, label: slot.value ? undefined : slot.label, title: slot.label, dot: !!item.actions?.[slot.key] }))}\n              value={actionSlot || actionSlots[0].key}\n              onChange={setActionSlot}\n              p={p}\n              height={40}\n            />\n            {(() => {\n              const key = actionSlot || actionSlots[0].key;\n              const action = item.actions?.[key];\n              return (\n                <>\n                  <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>\n                    <button type="button" className="m3-press" onClick={() => setSlotAction(key, undefined)} style={{ height: 40, padding: "0 12px", borderRadius: 20, border: "none", background: !action ? p.primary : p.surfaceContainerHigh, color: !action ? p.onPrimary : p.onSurfaceVariant, fontSize: 12, fontWeight: 700 }}>{t("none", lang)}</button>\n                    <button type="button" className="m3-press" onClick={() => setSlotAction(key, { to: BACK_TARGET, transition: "slide" })} style={{ height: 40, padding: "0 12px", borderRadius: 20, border: "none", background: action?.to === BACK_TARGET ? p.primary : p.surfaceContainerHigh, color: action?.to === BACK_TARGET ? p.onPrimary : p.onSurfaceVariant, fontSize: 12, fontWeight: 700 }}>{t("goBack", lang)}</button>\n                    {frames.map((frame) => {\n                      const on = action?.to === frame.id;\n                      return <button key={frame.id} type="button" className="m3-press" onClick={() => setSlotAction(key, { to: frame.id, transition: action?.transition ?? "slide" })} style={{ height: 40, maxWidth: 180, padding: "0 12px", borderRadius: 20, border: "none", background: on ? p.primary : p.surfaceContainerHigh, color: on ? p.onPrimary : p.onSurfaceVariant, fontSize: 12, fontWeight: 700, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{frame.name || t("screen", lang)}</button>;\n                    })}\n                  </div>\n                  {action && action.to !== BACK_TARGET && (\n                    <Segmented<Transition> options={TRANSITIONS.map((tr) => ({ key: tr.key, icon: tr.icon, title: tr.label }))} value={action.transition} onChange={(transition) => setSlotAction(key, { ...action, transition })} p={p} height={40} />\n                  )}\n                </>\n              );\n            })()}\n          </div>\n        ) : (\n          <>\n            <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>\n              <button type="button" className="m3-press" onClick={() => onChange({ action: undefined })} style={{ height: 40, padding: "0 12px", borderRadius: 20, border: "none", background: !item.action ? p.primary : p.surfaceContainerHigh, color: !item.action ? p.onPrimary : p.onSurfaceVariant, fontSize: 12, fontWeight: 700 }}>{t("none", lang)}</button>\n              <button type="button" className="m3-press" onClick={() => onChange({ action: { to: BACK_TARGET, transition: "slide" } })} style={{ height: 40, padding: "0 12px", borderRadius: 20, border: "none", background: item.action?.to === BACK_TARGET ? p.primary : p.surfaceContainerHigh, color: item.action?.to === BACK_TARGET ? p.onPrimary : p.onSurfaceVariant, fontSize: 12, fontWeight: 700 }}>{t("goBack", lang)}</button>\n              {frames.map((frame) => {\n                const on = item.action?.to === frame.id;\n                return <button key={frame.id} type="button" className="m3-press" onClick={() => onChange({ action: { to: frame.id, transition: item.action?.transition ?? "slide" } })} style={{ height: 40, maxWidth: 180, padding: "0 12px", borderRadius: 20, border: "none", background: on ? p.primary : p.surfaceContainerHigh, color: on ? p.onPrimary : p.onSurfaceVariant, fontSize: 12, fontWeight: 700, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{frame.name || t("screen", lang)}</button>;\n              })}\n            </div>\n            {item.action && item.action.to !== BACK_TARGET && (\n              <div style={{ marginTop: 8 }}>\n                <Segmented<Transition> options={TRANSITIONS.map((tr) => ({ key: tr.key, icon: tr.icon, title: tr.label }))} value={item.action.transition} onChange={(transition) => onChange({ action: { ...item.action!, transition } })} p={p} height={40} />\n              </div>\n            )}\n          </>\n        )}\n      </Row>\n\n'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY

      - name: Remove one-shot helper files
        run: |
          git rm .github/workflows/patch-mobile-slot-actions.yml
          git rm .github/trigger-mobile-slot-actions

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Mobile.tsx
          git commit -m "Add per-slot mobile navigation editing"
          git push