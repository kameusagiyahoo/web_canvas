name: Implement architecture flow foundation

on:
  push:
    branches: [main]
    paths:
      - scripts/implement-architecture-flow.py
      - .github/workflows/implement-architecture-flow.yml

permissions:
  contents: write

concurrency:
  group: implement-architecture-flow
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: python scripts/implement-architecture-flow.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Commit implementation
        run: |
          git rm -f scripts/implement-architecture-flow.py .github/workflows/implement-architecture-flow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx components/ArchitectureFlow.tsx components/Toolbar.tsx components/MobileScreens.tsx lib/tokens.ts lib/project.ts lib/architecture-flow.ts lib/architecture-flow.test.ts e2e/core.e2e.ts docs/ARCHITECTURE_FLOW.md docs/TODO.md docs/ROADMAP.md
          git commit -m "Add app architecture flow foundation"
          git push
