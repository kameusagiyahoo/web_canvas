name: Validate mobile golden path

on:
  push:
    branches:
      - work/mobile-golden-path
    paths:
      - e2e/mobile-practical-journey.e2e.ts
      - .github/workflows/temp-mobile-golden-path.yml
      - .github/scripts/temp_mobile_golden_path_patch.py
      - components/**
      - app/**
      - docs/RELEASE_READINESS.md

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/mobile-golden-path
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply mobile usability patch
        run: python3 .github/scripts/temp_mobile_golden_path_patch.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /web_canvas
      - run: npx playwright install --with-deps chromium
      - name: Mobile golden path
        run: npx playwright test e2e/mobile-practical-journey.e2e.ts
      - name: Full E2E
        run: npm run test:e2e
      - name: Commit mobile control labels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/MobileParts.tsx components/MobileScreens.tsx
          git commit -m "Label mobile authoring controls [skip mobile-golden-path]"
          git push origin HEAD:work/mobile-golden-path
