name: Validate recovery gates

on:
  push:
    branches:
      - work/recovery-gates
    paths:
      - e2e/recovery.e2e.ts
      - docs/RELEASE_READINESS.md
      - .github/scripts/temp_recovery_gate_patch.py
      - .github/workflows/temp-recovery-gates.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/recovery-gates
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply recovery UX patch
        run: python3 .github/scripts/temp_recovery_gate_patch.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /web_canvas
      - run: npx playwright install --with-deps chromium
      - name: Recovery E2E
        run: npx playwright test e2e/recovery.e2e.ts
      - name: Full E2E
        run: npm run test:e2e
      - name: Commit recovery UX and aligned E2E
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx components/ProjectManager.tsx e2e/practical-journey.e2e.ts e2e/core.e2e.ts
          git commit -m "Keep project recovery visible after failed import [skip recovery-gates]"
          git push origin HEAD:work/recovery-gates
