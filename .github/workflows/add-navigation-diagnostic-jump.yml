name: Add navigation diagnostic jump

on:
  push:
    branches: [main]
    paths:
      - scripts/add-navigation-diagnostic-jump.py

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: python scripts/add-navigation-diagnostic-jump.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: git rm -f scripts/add-navigation-diagnostic-jump.py .github/workflows/add-navigation-diagnostic-jump.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/navigation-graph.ts lib/navigation-graph.test.ts components/NavigationGraph.tsx e2e/core.e2e.ts
          git commit -m "Add navigation diagnostic jumps"
          git push
