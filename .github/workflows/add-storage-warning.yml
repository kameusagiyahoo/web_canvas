name: Add storage warning

on:
  push:
    branches: [main]
    paths:
      - .github/run-add-storage-warning

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: python scripts/add-storage-warning.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /web_canvas
      - run: git rm scripts/add-storage-warning.py .github/workflows/add-storage-warning.yml .github/run-add-storage-warning
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Show recovery guidance when autosave fails"
          git push
