name: Apply prompt targets patch

on:
  push:
    branches:
      - work/prompt-implementation-targets

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/prompt-implementation-targets
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python scripts/apply-prompt-targets.py
      - name: Commit patched sources
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/tokens.ts lib/prompt.ts app/page.tsx
          git commit -m "Support explicit implementation targets"
          git push origin HEAD:work/prompt-implementation-targets
