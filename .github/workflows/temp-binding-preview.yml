name: Apply Quick flow binding preview patch

on:
  push:
    branches:
      - work/quick-flow-binding-preview

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip binding-preview-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/quick-flow-binding-preview
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - name: Apply binding preview patch
        run: python .github/scripts/temp_binding_preview_patch.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run test:e2e
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/ArchitectureFlow.tsx e2e/core.e2e.ts docs/TODO.md docs/ARCHITECTURE_FLOW.md
          git commit -m "Preview Quick flow Canvas ownership [skip binding-preview-patch]"
          git push origin HEAD:work/quick-flow-binding-preview
