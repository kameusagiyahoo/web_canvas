name: Implement architecture API node

on:
  push:
    branches: [main]
    paths:
      - scripts/implement-architecture-api-node.py
      - .github/workflows/implement-architecture-api-node.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: python scripts/implement-architecture-api-node.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Commit implementation and remove temporary automation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/implement-architecture-api-node.py .github/workflows/implement-architecture-api-node.yml
          git add app/page.tsx components/ArchitectureFlow.tsx lib/tokens.ts lib/architecture-flow.ts lib/architecture-flow.test.ts lib/project.ts lib/project.test.ts e2e/core.e2e.ts docs/ARCHITECTURE_FLOW.md docs/TODO.md
          git commit -m "Add design-only API architecture nodes"
          git push
