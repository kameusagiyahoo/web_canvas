name: ChatGPT Preview keyboard focus patch

on:
  push:
    branches:
      - chatgpt/preview-keyboard-focus

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/preview-keyboard-focus
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/apply_preview_keyboard_focus.py
      - name: Commit patch and remove temporary files
        run: |
          rm scripts/apply_preview_keyboard_focus.py
          rm .github/workflows/chatgpt-preview-keyboard-focus.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Improve Preview keyboard accessibility"
          git push origin HEAD:chatgpt/preview-keyboard-focus
