name: Patch layer command extraction

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Extract layer reorder commands from page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('app/page.tsx')
          text = page.read_text()

          import_anchor = 'import { barSlotOf, carryFrame, pullInto, tidyFrame } from "@/lib/tidy";\n'
          import_line = 'import { reorderFrameGroups, reorderItemsInGroup } from "@/lib/layer-commands";\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          old_reorder_layers = '''  const reorderLayers = (topFirst: string[]) => {
    const inFrame = new Set(topFirst);
    const byId = new Map(groupsRef.current.map((g) => [g.id, g]));
    const ordered = [...topFirst].reverse().map((id) => byId.get(id)).filter((g): g is Group => !!g);
    if (ordered.length !== inFrame.size) return;
    layerSnapshot("layers:" + (layersFrame?.id ?? ""));
    for (const id of inFrame) instantRef.current.add(id);
    setGroups((gs) => [...gs.filter((g) => !inFrame.has(g.id)), ...ordered]);
  };
'''
          new_reorder_layers = '''  const reorderLayers = (topFirst: string[]) => {
    const next = reorderFrameGroups(groupsRef.current, topFirst);
    if (!next) return;
    layerSnapshot("layers:" + (layersFrame?.id ?? ""));
    for (const id of topFirst) instantRef.current.add(id);
    setGroups(next);
  };
'''
          if old_reorder_layers not in text:
              raise SystemExit('reorderLayers block not found')
          text = text.replace(old_reorder_layers, new_reorder_layers, 1)

          start = text.find('  const reorderGroupItems = (groupId: string, order: string[]) => {')
          end_marker = '\n  /** The parts of one group in a new order:'
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('reorderGroupItems block not found')
          new = '''  const reorderGroupItems = (groupId: string, order: string[]) => {
    const g = groupsRef.current.find((x) => x.id === groupId);
    if (!g) return;
    const next = reorderItemsInGroup(g, order, widthsRef.current);
    if (!next) return;
    layerSnapshot("layers:items:" + groupId);
    instantRef.current.add(groupId);
    setGroups((gs) => gs.map((x) => (x.id === groupId ? next : x)));
  };
'''
          text = text[:start] + new + text[end:]
          page.write_text(text)
          PY
      - name: Remove one-shot workflow
        run: git rm .github/workflows/patch-layer-command-extraction.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx .github/workflows/patch-layer-command-extraction.yml
          git commit -m "Refactor layer reorder commands out of page"
          git push
