name: Add Playwright E2E

on:
  push:
    paths:
      - .github/run-add-playwright-e2e

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: python scripts/add-playwright-e2e.py
      - run: npm install --save-dev @playwright/test@1.55.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: git rm scripts/add-playwright-e2e.py .github/workflows/add-playwright-e2e.yml .github/run-add-playwright-e2e
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json playwright.config.ts e2e/core.spec.ts components/Preview.tsx .github/workflows/ci.yml
          git commit -m "Add Playwright core E2E coverage"
          git push
