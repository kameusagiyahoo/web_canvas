name: Extract canvas viewport

on:
  push:
    paths:
      - "scripts/extract-canvas-viewport.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: python scripts/extract-canvas-viewport.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: git rm scripts/extract-canvas-viewport.py .github/workflows/extract-canvas-viewport.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx docs/TODO.md lib/canvas-viewport.ts lib/canvas-viewport.test.ts
          git commit -m "Refactor canvas viewport calculations"
          git push origin main
