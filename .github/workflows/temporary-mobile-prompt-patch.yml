name: Temporary mobile Prompt patch

on:
  push:
    branches:
      - chatgpt/mobile-prompt-editor

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/mobile-prompt-editor
          fetch-depth: 0
      - name: Apply exact source patch
        run: node scripts/patch-mobile-prompt.mjs
      - name: Remove temporary automation
        run: rm scripts/patch-mobile-prompt.mjs .github/workflows/temporary-mobile-prompt-patch.yml
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx scripts/patch-mobile-prompt.mjs .github/workflows/temporary-mobile-prompt-patch.yml
          git diff --cached --quiet && exit 0
          git commit -m "Add mobile Prompt editor parity"
          git push origin HEAD:chatgpt/mobile-prompt-editor
