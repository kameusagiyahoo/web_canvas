name: Apply Canvas relation trace patch

on:
  push:
    branches:
      - work/canvas-relation-trace

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip canvas-relation-trace]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/canvas-relation-trace
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply relation trace patch
        run: python .github/scripts/temp_canvas_relation_trace_patch.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run test:e2e
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/ArchitectureFlow.tsx e2e/core.e2e.ts docs/ARCHITECTURE_FLOW.md docs/TODO.md
          git commit -m "Trace Architecture relations from Canvas parts [skip canvas-relation-trace]"
          git push
