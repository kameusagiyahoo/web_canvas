name: Patch mobile screen actions

on:
  push:
    paths:
      - '.github/workflows/patch-mobile-screens.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire rename duplicate and delete
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('app/page.tsx')
          text = path.read_text()
          pattern = r'(onAdd=\{\(\) => \{\s*addFrame\(\);\s*setSheet\(null\);\s*\}\})'
          replacement = r'''\1
                  onRename={(id, name) => patchFrame(id, { name })}
                  onDuplicate={(id) => duplicateFrame(id)}
                  onDelete={(id) => deleteFrame(id)}'''
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one MobileScreens onAdd target, found {count}')
          path.write_text(text)

      - name: Remove one-shot workflow
        run: git rm .github/workflows/patch-mobile-screens.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Complete mobile screen management"
          git push
