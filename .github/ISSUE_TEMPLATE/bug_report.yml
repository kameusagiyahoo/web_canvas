name: バグ報告
description: Editor、Preview、Promptなどが期待どおり動かない場合
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        報告ありがとうございます。再現手順とスクリーンショットがあると原因を特定しやすくなります。
  - type: textarea
    id: what
    attributes:
      label: 発生したこと
      description: 行った操作、期待した結果、実際の結果を書いてください。
      placeholder: 2つのボタンを連結してグループ化したところ、内側の角まで完全な丸になった。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      placeholder: |
        1. ボタンを2つ追加して近づける
        2. 両方を選択してグループ化する
        3. 内側の角を確認する
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: BrowserとOS
      placeholder: Chrome 140 / Windows 11、Safari / iPhone など
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: 発生場所
      options:
        - Editor（PC）
        - Editor（スマホ）
        - Preview
        - 生成Prompt
        - PNG書き出し
        - その他
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: スクリーンショットまたは画面録画
      description: 画像や動画を添付してください。Promptの問題なら該当部分を貼り付けてください。
