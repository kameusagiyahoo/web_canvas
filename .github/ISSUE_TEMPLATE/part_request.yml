name: Part追加要望
description: PartsパネルにまだないMaterial 3コンポーネントの追加要望
labels: ["part request"]
body:
  - type: input
    id: name
    attributes:
      label: コンポーネント
      description: Material上の名称と、分かればm3.material.ioの参照URLを書いてください。
      placeholder: Date picker — https://m3.material.io/components/date-pickers
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 何に使いますか
      description: どのような画面で必要かを書いてください。必要なvariantを判断する材料にします。
    validations:
      required: true
  - type: checkboxes
    id: expressive
    attributes:
      label: Material 3 Expressive
      options:
        - label: Material 3 Expressiveで新規追加または変更されたPartである
